<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Animated Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #4f46e5, #ec4899);
      color: white;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    .circle {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      filter: blur(10px);
      animation: float 5s ease-in-out infinite;
    }

    .circle.one {
      top: 15%;
      left: 10%;
    }

    .circle.two {
      bottom: 15%;
      right: 10%;
      animation-delay: 1.5s;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
      animation: fadeDown 1s ease forwards;
    }

    p {
      font-size: 20px;
      max-width: 600px;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.5s;
    }

    .btn {
      margin-top: 30px;
      padding: 14px 30px;
      border: none;
      border-radius: 999px;
      background: white;
      color: #4f46e5;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      opacity: 0;
      animation: fadeUp 1s ease forwards;
      animation-delay: 1s;
    }

    .btn:hover {
      transform: scale(1.08);
      background: #facc15;
      color: #111827;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .section {
      padding: 80px 20px;
      background: #0f172a;
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 40px auto 0;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 20px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-10px);
      background: rgba(255,255,255,0.15);
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-30px);
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      p {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="circle one"></div>
    <div class="circle two"></div>

    <h1>Welcome to My Website</h1>
    <p>
      This is a smooth animated website that can be opened from a normal Vercel link.
    </p>
    <button class="btn" onclick="alert('Button clicked!')">Get Started</button>
  </section>

  <section class="section">
    <h2>My Features</h2>

    <div class="cards">
      <div class="card">
        <h3>Fast</h3>
        <p>Loads quickly on mobile and desktop.</p>
      </div>

      <div class="card">
        <h3>Animated</h3>
        <p>Smooth CSS animations and hover effects.</p>
      </div>

      <div class="card">
        <h3>Responsive</h3>
        <p>Looks good on all screen sizes.</p>
      </div>
    </div>
  </section>

</body>
</html>
